<!doctype html>
<html lang="ko">
  <link rel="apple-touch-icon" href="./travel-icon.png">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행노트</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f5f1;
      color: #182a25;
      font: 16px system-ui, sans-serif;
    }

    main { max-width: 840px; margin: auto; padding: 24px 18px; }
    .top-bar, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    button {
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid #dce6de;
      border-radius: 12px;
      background: white;
      color: inherit;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary { background: #175843; color: white; border-color: transparent; }
    .hero {
      margin: 16px 0 26px;
      padding: 28px;
      border-radius: 22px;
      background: #173e32;
      color: white;
    }

    .hero h1 { margin: 0 0 8px; }
    .hero p, .card p { margin: 0; }
    #trip-list { display: grid; gap: 12px; }
    .card {
      padding: 18px;
      border: 1px solid #dce6de;
      border-radius: 16px;
      background: white;
    }

    .card h3 { margin: 0 0 8px; }
    .card p, #empty { color: #52665d; }
    dialog {
      width: min(440px, calc(100% - 28px));
      max-height: 90vh;
      padding: 22px;
      border: 0;
      border-radius: 20px;
      color: inherit;
    }

    dialog::backdrop { background: #102c2480; }
    dialog h2 { margin-top: 0; }
    label { display: block; margin-top: 14px; }
    input, select {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid #c5d5cb;
      border-radius: 9px;
      background: white;
      color: inherit;
      font: inherit;
    }

    input[type="date"], input[type="datetime-local"] {
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      text-align: left;
    }

    .actions { justify-content: flex-end; margin-top: 20px; }
    #other-field[hidden] { display: none; }
    [hidden] { display: none !important; }

.card { position: relative; padding-right: 64px; }
.card-menu { position: absolute; top: 12px; right: 12px; }

.card-menu summary {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  list-style: none;
  font-size: 24px;
  cursor: pointer;
}

.card-menu summary::-webkit-details-marker { display: none; }
/* 마우스를 올릴 수 있는 기기에서만 */
@media (hover: hover) and (pointer: fine) {
  button:hover {
    filter: brightness(0.94);
  }

  .card-menu summary:hover {
    background: #eaf2ec;
  }
}

/* 클릭하거나 터치로 누르는 순간 */
button:active,
.card-menu summary:active {
  transform: scale(0.97);
  filter: brightness(0.88);
}

.card-menu summary:active {
  background: #dce9df;
}

.card-menu button {
  position: absolute;
  top: 46px;
  right: 0;
  z-index: 1;
  white-space: nowrap;
  box-shadow: 0 4px 14px #182a2520;
}


.list-menu { position: relative; top: auto; right: auto; }

.trip-title {
  min-height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
}

/* 제목 버튼의 터치 범위를 카드 전체로 넓혀 */
.trip-title::after {
  content: "";
  position: absolute;
  inset: 0;
}

/* 카드의 ⋮ 메뉴는 터치 영역 위에 둬 */
.card > .card-menu {
  z-index: 2;
}
.trip-title:hover,
.trip-title:active {
  filter: none;
  transform: none;
}


.detail-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.detail-tabs [aria-pressed="true"] {
  background: #175843;
  color: white;
}

#detail-content .card {
  margin-bottom: 10px;
  padding-right: 18px;
}

#detail-content textarea {
  width: 100%;
  min-height: 76px;
  margin: 6px 0;
  padding: 10px;
  border: 1px solid #c5d5cb;
  border-radius: 9px;
  font: inherit;
}

#detail-content .check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 10px;
}

#detail-content .check-row input {
  width: 22px;
  min-height: 22px;
  margin: 0;
}

.check-row input:checked + span {
  text-decoration: line-through;
}

.day-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.day-heading small { color: #52665d; }
.day-heading h3 { margin: 2px 0 0; }
.day-summary { overflow-wrap: anywhere; }
.day-summary strong { display: block; margin-top: 10px; }
.day-summary p { margin-top: 10px; white-space: pre-wrap; }

.day-summary strong + p {
  padding-top: 10px;
  border-top: 1px solid #dce6de;
}

    .card-menu .trip-actions { position: absolute; top: 46px; right: 0; z-index: 3; display: grid; gap: 5px; padding: 5px; background: white; border-radius: 12px; box-shadow: 0 4px 14px #182a2520; }
    .card-menu .trip-actions button { position: static; box-shadow: none; }
    .pay-people { margin: 12px 0; border: 1px solid #dce6de; border-radius: 10px; }
    .pay-people label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .pay-people input { width: 20px; min-height: 20px; margin: 0; accent-color: #175843; }
    #trip-detail .hero { position: relative; }
    #detail-title { padding-right: 46px; overflow-wrap: anywhere; }
    #detail-meta { overflow-wrap: anywhere; }
    #detail-dates { margin-top: 6px; }
    #detail-dates span { display: inline-block; white-space: nowrap; }
    .detail-options { z-index: 3; }
    .detail-options summary { color: white; }
    .detail-options #edit-trip { color: #173e32; }
    .detail-options summary:hover, .detail-options summary:active { color: #173e32; }
    .res-copy .res-copy-code { min-height: 44px; padding: 4px 10px; font-size: .85rem; }
    .res-code-text { min-width: 0; overflow-wrap: anywhere; }
    .required-mark {
      color: #b42318; font-size: .8em;
    }
    .required-mark { margin-inline-start: 4px; }
    label:has(> :required) > .required-mark { display: inline; }
    label > .required-mark { display: none; }
    legend > .required-mark { display: inline; }
    #delete-trip { margin-right: auto; color: #a92d2d; background: #fff0ee; }
    #confirm-trip-delete { color: #a92d2d; background: #fff0ee; }
    #confirm-trip-delete:disabled { opacity: .45; cursor: default; }
    #trip-delete-confirm label { display: flex; gap: 10px; align-items: center; }
    #trip-delete-confirm input { width: 20px; min-height: 20px; margin: 0; flex: none; accent-color: #a92d2d; }
    #trip-delete-error { color: #a92d2d; }
    #trip-delete-error:empty { display: none; }
    #trip-form-error { color: #a92d2d; }
    #trip-form-error:empty { display: none; }
    #detail-content .packing-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
    #detail-content .packing-item .check-row { flex: 1; min-width: 0; margin: 0; min-height: 44px; cursor: pointer; }
    #detail-content .packing-item input { flex: none; accent-color: #175843; }
    .packing-item span { overflow-wrap: anywhere; }
    .packing-item input:checked + span { color: #52665d; }
    .packing-remove { min-width: 44px; padding: 0; color: #a92d2d; background: #fff0ee; border-color: #f2d8d5; font-size: 22px; }
  #detail-content form:has(input[aria-label="새 준비물"]) {
  display: flex;
  align-items: center;
  gap: 8px;
}

#detail-content input[aria-label="새 준비물"] {
  flex: 1;
  min-width: 0;
  margin: 0;
}

#detail-content form:has(input[aria-label="새 준비물"]) button {
  flex-shrink: 0;
  white-space: nowrap;
}
  .shopping-toolbar, .shopping-controls { display: flex; gap: 8px; align-items: center; }
  .shopping-toolbar { flex-wrap: wrap; margin-bottom: 12px; }
 /* 전체 */
.shopping-toolbar button[aria-pressed] {
  --filter-bg: #edf6ff;
  --filter-selected: #d2e9ff;
  --filter-text: #28587d;
}

/* 내꺼 */
.shopping-toolbar button:nth-child(2) {
  --filter-bg: #e4f2e8;
  --filter-selected: #cce6d4;
  --filter-text: #245b40;
}

/* 줄꺼 */
 .shopping-toolbar button:nth-child(3) {
  --filter-bg: #fce8f1;
  --filter-selected: #ffdaed;
  --filter-text: #a12662;
}

.shopping-toolbar button[aria-pressed] {
  background: var(--filter-bg);
  color: var(--filter-text);
}

.shopping-toolbar button[aria-pressed="true"] {
  background: var(--filter-selected);
  border-color: var(--filter-text);
}
  .shopping-add { margin-left: auto; min-width: 44px; }
  .shopping-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .shopping-text { min-width: 0; overflow-wrap: anywhere; }
  .shopping-text .shopping-memo { white-space: pre-wrap; }
  #detail-content .shopping-card .check-row { margin: 7px 0; min-height: 28px; cursor: pointer; }
  .shopping-card input[type="checkbox"] { flex: none; accent-color: #175843; }
  .shopping-badge { display: inline-block; padding: 3px 8px; color: #245b40; background: #e4f2e8; border-radius: 20px; }
  .shopping-badge.gift { background: #fce8f1; color: #a12662; }
  .shopping-controls button { padding-inline: 9px; }
  .expense-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .expense-total { font-size: 1.35rem; font-weight: 750; color: #175843; }
  .expense-form .res-pay { min-width: 0; margin: 0; padding: 0; border: 0; }
  .expense-error, .expense-delete { color: #a92d2d; }
  .expense-delete { margin-right: auto; background: #fff0ee; }
  .expense-list-title { margin: 20px 0 12px; }
  .expense-summary-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; }
  .expense-summary-row + .expense-summary-row { border-top: 1px solid #dce6de; }
  .expense-summary-row > span { min-width: 0; overflow-wrap: anywhere; }
  .expense-summary-row > strong { min-width: 0; text-align: right; overflow-wrap: anywhere; }
  .expense-breakdown { margin-top: 10px; border-top: 1px solid #dce6de; }
  .expense-breakdown > summary { min-height: 44px; padding: 11px 0; color: #52665d; cursor: pointer; }
  .expense-nav { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .expense-nav [aria-pressed="true"] { background: #e4effc; color: #254e74; border-color: #bfd5ea; }
  .expense-add { background: #ffe7e3; color: #a53934; border-color: #f5c7c1; }
  .expense-rate-bar { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; margin: 10px 0 16px; text-align: right; color: #52665d; }
  .expense-date { margin: 20px 0 8px; font-size: 1rem; color: #52665d; }
  .expense-entry-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .expense-entry-head h3, .expense-entry-meta dd { min-width: 0; overflow-wrap: anywhere; }
  .expense-entry-head button { flex: none; }
  .expense-entry-amount { display: block; margin-top: 4px; font-size: 1.15rem; }
  .expense-entry-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 12px 0 0; font-size: .9rem; }
  .expense-entry-meta dt { color: #52665d; }
  .expense-entry-meta dd { margin: 0; }
  .expense-booking-tag { display: inline-block; margin-top: 8px; padding: 3px 8px; border-radius: 12px; background: #e4f2e8; color: #245b40; }
  .res-pay, .pay-people { min-width: 0; min-inline-size: 0; }
  .res-payment-remove { display: block; margin: 0 0 0 auto; }
  .res-payment-add { margin-top: 12px; }
  .res-payment-add small { display: block; margin-top: 5px; }
</style>
</head>

<body>
  <main>
    <header class="top-bar">
      <strong>여행노트</strong>
      <button class="primary" id="open-trip">+ 새 여행</button>
    </header>

    <section class="hero">
      <h1>나의 여행</h1>
      <p>다음에 떠날 곳과 다녀온 여행을 한곳에.</p>
    </section>

    <div class="top-bar">
  <h2 id="list-title">여행 목록</h2>
  <details class="card-menu list-menu" id="list-options" hidden>
  <summary aria-label="여행 목록 옵션">⋮</summary>
  <button type="button" id="toggle-hidden">🔒3</button>
</details>
</div>
    <p id="empty">아직 여행이 없어요. 첫 여행을 만들어보세요.</p>
    <div id="trip-list"></div>
  </main>

<main id="trip-detail" hidden>
  <button type="button" id="back-to-list">여행 목록으로</button>

  <section class="hero">
    <h1 id="detail-title"></h1>
    <p id="detail-meta"></p>
    <p id="detail-dates" hidden></p>
    <details class="card-menu detail-options" id="detail-options">
      <summary aria-label="여행 옵션">⋮</summary>
      <button type="button" id="edit-trip">여행 정보 수정</button>
    </details>
  </section>

  <div class="detail-tabs" aria-label="여행 상세 메뉴">
    <button type="button" data-tab="days">일정</button>
    <button type="button" data-tab="bookings">예약</button>
    <button type="button" data-tab="packing">짐 목록</button>
    <button type="button" data-tab="shopping">쇼핑</button>
    <button type="button" data-tab="expenses">경비</button>
  </div>

  <section id="detail-content"></section>
</main>

  <dialog id="new-trip">
    <form id="trip-form">
      <h2>새 여행</h2>

      <label>여행 이름<span class="required-mark" aria-hidden="true">*</span>
        <input name="tripName" placeholder="나홀로 한여름의 크리스마스" required>
      </label>

      <label>여행지<span class="required-mark" aria-hidden="true">*</span>
        <select name="destination" required>
          <option value="">선택</option>
          <option value="KRW">국내</option>
          <option value="USD">미국</option>
          <option value="JPY">일본</option>
          <option value="AUD">호주</option>
          <option value="CNY">중국</option>
          <option value="EUR">유럽(유로 사용 지역)</option>
          <option value="PHP">필리핀</option>
          <option value="VND">베트남</option>
          <option value="TWD">대만</option>
          <option value="SGD">싱가포르</option>
          <option value="other">기타</option>
        </select>
      </label>

      <label id="other-field" hidden>여행지 직접 입력<span class="required-mark" aria-hidden="true">*</span>
        <input name="otherDestination" placeholder="예: 캐나다">
      </label>

      <label id="other-currency-field" hidden>현지 통화<span class="required-mark" aria-hidden="true">*</span>
        <select name="otherCurrency"></select>
      </label>

      <label>지역
        <input name="region" placeholder="제주">
      </label>

      <p>사용 통화 <strong id="currency">—</strong></p>

      <label>동행자
        <input name="companions" placeholder="예: 친구 A, 친구 B">
        <small>이름을 쉼표로 구분해요.</small>
      </label>

      <label>떠나는 날<span class="required-mark" aria-hidden="true">*</span> <input type="date" name="start" required></label>
      <label>돌아오는 날<span class="required-mark" aria-hidden="true">*</span> <input type="date" name="end" required></label>

      <p id="trip-form-error" role="alert"></p>
      <div class="actions">
        <button type="button" id="delete-trip" hidden>삭제</button>
        <button type="button" id="close-trip">닫기</button>
        <button class="primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>
<dialog id="pin-dialog">
  <form id="pin-form">
    <h2 id="pin-title">🔐해제</h2>
    <label>🔑4자리<span class="required-mark" aria-hidden="true">*</span>
      <input id="pin-input" type="password" inputmode="numeric"
             pattern="[0-9]{4}" maxlength="4" required>
    </label>
    <p id="pin-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="pin-cancel">닫기</button>
      <button class="primary" type="submit" id="pin-submit">열기</button>
    </div>
  </form>
</dialog>
  <dialog id="trip-delete-confirm" aria-labelledby="trip-delete-title">
    <h2 id="trip-delete-title">여행 삭제</h2>
    <p id="trip-delete-name"></p>
    <p>이 여행의 예약·결제·메모·체크리스트도 함께 삭제돼요.</p>
    <label><input type="checkbox" id="acknowledge-trip-delete"> 함께 지워지는 기록을 확인했어요.</label>
    <p id="trip-delete-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="cancel-trip-delete" autofocus>취소</button>
      <button type="button" id="confirm-trip-delete" disabled>삭제</button>
    </div>
  </dialog>
  <script>
    const dialog = document.getElementById('new-trip');
    const form = document.getElementById('trip-form');
    const list = document.getElementById('trip-list');
    const currency = document.getElementById('currency');
    const { destination, otherDestination, start, end } = form.elements;
    const storageKey = 'my-travel-notebook';
    const trips = JSON.parse(localStorage.getItem(storageKey) || '[]');
let showHidden = false;
    let tripDraft = null;
    let editingTrip = null;
    const tripFormError = document.getElementById('trip-form-error');
    const deleteTripButton = document.getElementById('delete-trip');
    const otherCurrency = form.elements.otherCurrency;
    const supportedCurrencies = typeof Intl.supportedValuesOf === 'function'
      ? Intl.supportedValuesOf('currency')
      : ['AUD', 'CAD', 'CHF', 'CNY', 'EUR', 'GBP', 'HKD', 'JPY', 'KRW', 'NZD', 'PHP', 'SGD', 'THB', 'TWD', 'USD', 'VND'];
    const currencyNames = new Intl.DisplayNames(['ko'], { type: 'currency' });
    otherCurrency.add(new Option('통화 선택', ''));
    supportedCurrencies.forEach(code =>
      otherCurrency.add(new Option(code + ' · ' + currencyNames.of(code), code))
    );

    function peopleFrom(text) {
      return [...new Set(text.split(',').map(name => name.trim()).filter(Boolean))];
    }

    function tripPeople(trip) {
      return [...new Set(['나', ...(trip.companions || [])])];
    }

    function openTripForm(source = null, edit = false) {
      editingTrip = edit ? source : null;
      tripDraft = edit ? null : source;
      deleteTripButton.hidden = !edit;
      tripFormError.textContent = '';
      form.reset();
      end.min = '';
      form.querySelector('h2').textContent = edit ? '여행 정보 수정' : source ? '복제' : '새 여행';
      if (source) {
        form.elements.tripName.value = source.name;
        form.elements.region.value = source.region || '';
        form.elements.companions.value = (source.companions || []).join(', ');
        const known = [...destination.options].find(option =>
          option.value && option.value !== 'other' &&
          option.textContent.trim() === source.country
        );
        destination.value = known ? known.value : 'other';
        otherDestination.value = known ? '' : source.country || '';
        otherCurrency.value = source.currency || '';
        if (edit) {
          start.value = source.start || '';
          end.value = source.end || '';
          end.min = start.value;
        }
      }
      updateDestination();
      dialog.showModal();
    }

    const dateFormat = new Intl.DateTimeFormat('ko-KR', {
      month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'UTC'
    });

    function updateDestination() {
      const other = destination.value === 'other';
      document.getElementById('other-field').hidden = !other;
      otherDestination.required = other;
      document.getElementById('other-currency-field').hidden = !other;
      otherCurrency.required = other;
      currency.textContent = (other ? otherCurrency.value : destination.value) || '—';
    }

    function addTripCard(trip) {
      const card = document.createElement('article');
      const title = document.createElement('h3');
      const place = document.createElement('p');
      card.className = 'card';
      const openButton = document.createElement('button');
openButton.type = 'button';
openButton.className = 'trip-title';
openButton.textContent = trip.name;
openButton.addEventListener('click', () => openTripDetail(trip));
title.replaceChildren(openButton);
      place.textContent = [trip.country, trip.region, trip.currency].filter(Boolean).join(' · ');
      card.append(title, place);

      if (trip.start && trip.end) {
        const dates = document.createElement('p');
        const nights = (Date.parse(trip.end) - Date.parse(trip.start)) / 86400000;
        const duration = nights === 0 ? '당일' : nights + '박 ' + (nights + 1) + '일';
        dates.textContent = dateFormat.format(new Date(trip.start)) + ' ~ ' +
          dateFormat.format(new Date(trip.end)) + ' · ' + duration;
        card.append(dates);
      }

      const menu = document.createElement('details');
menu.className = 'card-menu';

const dots = document.createElement('summary');

      button('+ 결제 추가', () => payments.append(paymentField(trip, today))),
      element('small', '예약금과 잔금은 따로 추가해요.')
    );
    form.append(payments, addPayment);

    const error = element('p', '', 'res-error');
    error.setAttribute('role', 'alert');
    const actions = element('div', '', 'actions');

    if (existing) {
      actions.append(button('삭제', () => {
        const hasPayments = (existing.payments || []).length > 0;
        const question = hasPayments
          ? '예약과 이 예약에 저장한 결제 내역을 함께 삭제할까요?'
          : '이 예약을 삭제할까요?';
        if (!confirm(question)) return;

        trip.bookings.splice(trip.bookings.indexOf(existing), 1);
        saveTripDetails();
        editorState = null;
        draw();
      }, 'res-delete'));
    }

    actions.append(button('닫기', () => {
      editorState = null;
      draw();
    }));

    const save = element('button', '저장', 'primary');
    save.type = 'submit';
    actions.append(save);
    form.append(error, actions);

    form.addEventListener('submit', event => {
      event.preventDefault();

      try {
        const value = name => form.elements.namedItem(name).value.trim();
        const booking = {
          type: stay ? '숙소' : value('type'),
          name: value('name'),
          date: value('date'),
          time: mainTime.read(),
          place: value('place'),
          code: value('code'),
          link: value('link'),
          memo: value('memo')
        };

        if (!booking.name) throw new Error('예약 이름을 입력해 주세요.');

        if (stay) {
          booking.checkout = value('checkout');
          booking.checkoutTime = endTime.read();
          const deadlineDate = value('deadlineDate');
          const deadlineClock = deadlineTime.read();
          if (Boolean(deadlineDate) !== Boolean(deadlineClock)) {
            throw new Error('무료취소 마감일과 시각을 함께 입력해 주세요.');
          }
          booking.deadline = deadlineDate ? deadlineDate + 'T' + deadlineClock : '';
          if (booking.checkout <= booking.date) {
            throw new Error('체크아웃은 체크인 다음 날 이후로 골라 주세요.');
          }
        }

        if (flight) {
          booking.arrivalDate = value('arrivalDate');
          booking.arrivalTime = endTime.read();
          booking.arrivalPlace = value('arrivalPlace');
          if (booking.arrivalTime && !booking.arrivalDate) {
            throw new Error('도착 시각을 적었다면 도착 날짜도 골라 주세요.');
          }
        }

        booking.payments = Array.from(payments.children, readPayment);

        if (existing) Object.assign(existing, booking);
        else trip.bookings.push(booking);

        saveTripDetails();
        editorState = null;

        if (selectedDate && !visibleOn(booking, selectedDate)) {

        error.textContent = problem.message;

  function visibleOn(booking, date) {
    if (!date) return true;
    if (booking.type === '숙소' && booking.date && booking.checkout) {
      return booking.date <= date && date <= booking.checkout;
    }
    return booking.date === date || booking.arrivalDate === date;
  }

  function timeOn(booking, date) {
    if (date && booking.type === '숙소' && date === booking.checkout) {
      return booking.checkoutTime || '';
    }
    if (!date || date === booking.date) return booking.time || '';
    if (date === booking.arrivalDate) return booking.arrivalTime || '';
    return '';
  }

  async function copyCode(code, control) {
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      const temporary = document.createElement('textarea');
      temporary.value = code;
      temporary.style.position = 'fixed';
      temporary.style.opacity = '0';
      document.body.append(temporary);
      temporary.select();

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch {
        // 일부 브라우저는 파일에서 복사를 제한해.
      } finally {
        temporary.remove();
      }

      if (!copied) {
        window.prompt('예약번호를 선택해 복사하세요.', code);
        return;
      }
    }

    control.textContent = '복사됨';
    setTimeout(() => { control.textContent = '복사'; }, 1500);
  }

      }
    } else if (booking.type === '숙소') {
      if (selectedDate && booking.date < selectedDate && selectedDate < booking.checkout) {
        line('묵는 숙소');

      if (booking.checkout) line('체크아웃', dateText(booking.checkout), booking.checkoutTime);
      line(booking.place);
      if (booking.deadline) line('무료취소 마감', booking.deadline.replace('T', ' '));
    } else {
      line(dateText(booking.date), booking.time, booking.place);

    if (booking.code) {
      const code = element('div', '', 'res-copy');
      const copy = button('복사', () => copyCode(booking.code, copy), 'res-copy-code');

      code.append(element('span', `예약번호 ${booking.code}`, 'res-code-text'), copy);
      card.append(code);
    }

    line(booking.memo);

    if (/^https?:\/\//i.test(booking.link || '')) {
      const link = element('a', '예약 링크 열기');
      link.href = booking.link;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      card.append(link);
    }

    if (booking.payments?.length) {
      const totals = new Map();
      booking.payments.forEach(payment => {
        totals.set(payment.currency, (totals.get(payment.currency) || 0) + payment.amount);
      });

      const paid = [...totals].map(([currency, amount]) =>
        new Intl.NumberFormat('ko-KR', { style: 'currency', currency }).format(amount)
      ).join(' · ');

      const paymentLine = element('p');
      paymentLine.append(element('small', `결제 ${paid}`));
      card.append(paymentLine);
    }

    panel.append(card);
  }

function renderShopping(trip) {
  const categories = { personal: '내꺼', gift: '줄꺼' };
  let filter = '';
  let editorOpen = false;
  let editing = null;
  const kindOf = item => item.kind === 'gift' ? 'gift' : 'personal';

  function node(tag, text, className = '') {
    const element = document.createElement(tag);
    element.textContent = text;
    element.className = className;
    return element;
  }

  function button(text, action, className = '') {
    const control = node('button', text, className);
    control.type = 'button';
    control.addEventListener('click', action);
    return control;
  }

  function save(next) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(trips.map(entry =>
        entry === trip ? { ...entry, shopping: next } : entry
      )));
      trip.shopping = next;
      return true;
    } catch {
      window.alert('브라우저에 쇼핑 목록을 저장할 수 없어요.');
      return false;
    }
  }

  function open(item = null) {
    editing = item;
    editorOpen = true;
    draw();
    detailContent.querySelector('.shopping-form input[name="name"]').focus();
  }

  function drawEditor() {
    const card = detailCard(editing ? '쇼핑 항목 수정' : '쇼핑 항목 추가');
    const form = node('form', '', 'shopping-form');
    form.innerHTML = `
      <label>구분
        <select name="kind"><option value="personal">내꺼</option><option value="gift">줄꺼</option></select>
      </label>
      <label>무엇을<span class="required-mark" aria-hidden="true">*</span> <input name="name" placeholder="예: 말차 과자" required></label>
      <label class="shopping-recipient">누구에게 <input name="recipient" placeholder="예: 엄마"></label>
      <label>몇 개<span class="required-mark" aria-hidden="true">*</span> <input name="quantity" type="number" min="1" step="1" inputmode="numeric" required></label>
      <label>메모 <textarea name="memo" placeholder="살 곳이나 기억할 것"></textarea></label>
      <div class="actions">
        <button type="button" class="shopping-cancel">닫기</button>
        <button type="submit" class="primary">저장</button>
      </div>
    `;
    const { kind, name, recipient, quantity, memo } = form.elements;
    kind.value = editing ? kindOf(editing) : filter || 'personal';
    name.value = editing?.name || '';
    recipient.value = editing?.recipient || '';
    quantity.value = editing?.quantity || 1;
    memo.value = editing?.memo || '';

    function updateRecipient() {
      recipient.closest('label').hidden = kind.value !== 'gift';
      recipient.disabled = kind.value !== 'gift';
    }

    kind.addEventListener('change', updateRecipient);
    updateRecipient();
    form.querySelector('.shopping-cancel').addEventListener('click', () => {
      editorOpen = false;
      draw();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const title = name.value.trim();
      if (!title) {
        name.setCustomValidity('무엇을 살지 입력해 주세요.');
        name.reportValidity();
        return;
      }
      const item = {
        name: title, kind: kind.value, done: Boolean(editing?.done),
        recipient: recipient.disabled ? '' : recipient.value.trim(),
        quantity: Number(quantity.value), memo: memo.value.trim()
      };
      const next = editing
        ? trip.shopping.map(entry => entry === editing ? item : entry)
        : [...trip.shopping, item];
      if (!save(next)) return;
      if (filter) filter = item.kind;
      editorOpen = false;
      draw();
    });

    name.addEventListener('input', () => name.setCustomValidity(''));
    card.append(form);
  }

  function draw() {
    detailContent.replaceChildren();
    const toolbar = node('div', '', 'shopping-toolbar');
    for (const [value, label] of [['', '전체'], ...Object.entries(categories)]) {
      const control = button(label, () => {
        filter = value;
        editorOpen = false;
        draw();
      });
      control.setAttribute('aria-pressed', String(filter === value));
      toolbar.append(control);
    }
    const add = button('+', () => open(), 'primary shopping-add');
    add.setAttribute('aria-label', '쇼핑 항목 추가');
    toolbar.append(add);
    detailContent.append(toolbar);
    if (editorOpen) drawEditor();

    const visible = trip.shopping.filter(item => !filter || kindOf(item) === filter)
      .sort((a, b) => Number(Boolean(a.done)) - Number(Boolean(b.done)));

    if (!visible.length && !editorOpen) {
      detailContent.append(node('p', '아직 담아둔 물건이 없어요.'));
    }

    for (const item of visible) {
      const card = node('article', '', 'card shopping-card');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(item.done);
      const label = node('label', '', 'check-row');
      label.append(checkbox, node('span', item.name + ' × ' + (item.quantity || 1)));
      checkbox.addEventListener('change', () => {
        const next = trip.shopping.map(entry =>
          entry === item ? { ...entry, done: checkbox.checked } : entry
        );
        if (save(next)) draw();
        else checkbox.checked = Boolean(item.done);
      });

      const badge = node('small', categories[kindOf(item)], 'shopping-badge ' + kindOf(item));
      const text = node('div', '', 'shopping-text');
      text.append(badge, label);
      if (kindOf(item) === 'gift' && item.recipient) {
        text.append(node('p', item.recipient));
      }
      if (item.memo) text.append(node('p', item.memo, 'shopping-memo'));

      const edit = button('수정', () => open(item));
      const remove = button('×', () => {
        if (!save(trip.shopping.filter(entry => entry !== item))) return;
        if (editing === item) editorOpen = false;
        draw();
      }, 'packing-remove');
      remove.setAttribute('aria-label', item.name + ' 삭제');
      const actions = node('div', '', 'shopping-controls');
      actions.append(edit, remove);
      card.append(text, actions);
      detailContent.append(card);
    }
  }

  draw();
}

  function element(tag, text = '', className = '') {
    const item = document.createElement(tag);
    item.textContent = text;
    item.className = className;
    return item;
  }

  function button(text, action, className = '') {
    const item = element('button', text, className);
    item.type = 'button';
    item.addEventListener('click', action);
    return item;
  }

  function field(label, name, value = '', type = 'text', required = false) {
    const wrapper = element('label', label);
    const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
    if (type !== 'textarea') input.type = type;
    input.name = name;
    input.value = value || '';
    input.required = required;
    wrapper.append(requiredMark(), input);
    return wrapper;
  }

  function selectField(label, name, options, value) {
    const wrapper = element('label', label);
    const select = document.createElement('select');
    select.name = name;
    options.forEach(([key, text]) => select.add(new Option(text, key)));
    select.value = value ?? '';
    wrapper.append(requiredMark(), select);
    return wrapper;
  }

  function requiredMark() {
    const mark = element('span', '*', 'required-mark');
    mark.setAttribute('aria-hidden', 'true');
    return mark;
  }

  function currencyDecimals(code) {
    if (['KRW', 'JPY', 'VND'].includes(code)) return 0;
    return Math.min(2, new Intl.NumberFormat('ko-KR', {
      style: 'currency', currency: code
    }).resolvedOptions().maximumFractionDigits);
  }

  function formatAmount(value) {
    const match = value.replace(/,/g, '').match(/^([0-9]*)(\.[0-9]*)?$/);
    if (!match) return value;
    const whole = (match[1] || '0').replace(/^0+(?=\d)/, '');
    return value === '' ? '' : whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (match[2] || '');
  }

  function paymentField(trip, today, payment = {}, standalone = false) {
    const box = element('fieldset', '', 'res-pay');
    if (!standalone) {
      box.append(element('legend', '결제 내역'));
      const remove = button('×', () => box.remove(), 'packing-remove res-payment-remove');
      remove.setAttribute('aria-label', '결제 내역 빼기');
      box.append(remove);
    }

    const amount = field('실제로 낸 금액', 'amount', payment.amount ? formatAmount(String(payment.amount)) : '', 'text', true);
    const amountInput = amount.querySelector('input');
    amountInput.inputMode = 'decimal';
    amountInput.addEventListener('input', () => {
      const raw = amountInput.value;
      const offset = amountInput.selectionStart;
      const significant = raw.slice(0, offset).replace(/,/g, '').length;
      const formatted = formatAmount(raw);
      if (formatted === raw) return;
      amountInput.value = formatted;
      let caret = 0;
      let seen = 0;
      while (caret < formatted.length && seen < significant) {
        if (formatted[caret] !== ',') seen++;
        caret++;
      }
      amountInput.setSelectionRange(caret, caret);
    });

    const domestic = isDomesticTrip(trip);
    const defaultCurrency = domestic ? 'KRW' : trip.currency || 'KRW';
    const currency = payment.currency || defaultCurrency;
    const choices = [...new Set([defaultCurrency, 'KRW', 'USD', currency])]
      .map(code => [code, code]);

    const roster = tripPeople(trip);
    const selected = new Set(payment.people || ['나']);
    const members = [...new Set([...roster, ...selected, payment.payer || '나'])];
    const people = element('fieldset', '', 'pay-people');
    const legend = element('legend', '부담할 사람');
    legend.append(requiredMark());
    people.append(legend);

    function checkbox(caption, name, value) {
      const wrap = element('label');
      const control = document.createElement('input');
      control.type = 'checkbox';
      control.name = name;
      control.value = value;
      wrap.append(control, document.createTextNode(caption));
      people.append(wrap);
      return control;
    }

    const all = checkbox('전체', '', '');
    const checks = members.map(person => {
      const control = checkbox(person, 'people', person);
      control.checked = selected.has(person);
      return control;
    });

    function updateAll() {
      const count = checks.filter(control => control.checked).length;
      all.checked = count === checks.length;
      all.indeterminate = count > 0 && count < checks.length;
    }
    all.addEventListener('change', () => {
      checks.forEach(control => { control.checked = all.checked; });
      updateAll();
    });
    checks.forEach(control => control.addEventListener('change', updateAll));
    updateAll();

    const currencyField = domestic ? document.createElement('input')
      : selectField('통화', 'currency', choices, currency);
    if (domestic) {
      currencyField.type = 'hidden';
      currencyField.name = 'currency';
      currencyField.value = currency;
    }

    box.append(
      field(standalone ? '지출 이름' : '결제 이름', 'label', payment.label, 'text', standalone),
      amount,
      currencyField,
      ...(domestic && currency !== 'KRW' ? [element('small', '기존 결제 통화 · ' + currency)] : []),
      field('결제일', 'paidOn', payment.paidOn || today, 'date', true),
      selectField('결제자', 'payer', members.map(person => [person, person]), payment.payer || '나'),
      people
    );

    return box;
  }

function readPayment(box) {
  const read = name => box.querySelector('[name="' + name + '"]').value.trim();
  const rawAmount = read('amount').replace(/,/g, '');
  const amount = Number(rawAmount);
  const payer = read('payer');
  const people = Array.from(box.querySelectorAll('[name="people"]:checked'), control => control.value);
  const currency = read('currency');
  const decimals = currencyDecimals(currency);
  const validAmount = /^\d+(?:\.\d+)?$/.test(rawAmount) &&
    (rawAmount.split('.')[1]?.length || 0) <= decimals;
  if (!validAmount || !Number.isFinite(amount) || amount <= 0 || amount > 100000000000) {
    throw new Error(decimals
      ? currency + ' 금액은 0보다 크게, 소수 ' + decimals + '자리까지 입력해 주세요.'
      : currency + ' 금액은 0보다 큰 정수로 입력해 주세요.');
  }
  if (!payer || !people.length) {
    throw new Error('결제자와 부담할 사람을 선택해 주세요.');
  }

  return {
    label: read('label') || '결제',
    amount,
    currency,
    paidOn: read('paidOn'),
    payer,
    people
  };
}

function travelSettlement(records, scale, amountFor) {
  const paid = new Map();
  const owed = new Map();
  const add = (map, key, value) => map.set(key, (map.get(key) || 0) + value);
  let total = 0;
  for (const record of records) {
    const units = Math.round(amountFor(record) * scale);
    const payer = record.payer || '나';
    const people = [...new Set(record.people?.length ? record.people : [payer])];
    const share = Math.floor(units / people.length);
    const remainder = units % people.length;
    total += units;
    add(paid, payer, units);
    people.forEach((person, index) => add(owed, person, share + (index < remainder ? 1 : 0)));
  }

  const names = [...new Set([...paid.keys(), ...owed.keys()])];
  const balances = names.map(name => ({
    name, amount: (paid.get(name) || 0) - (owed.get(name) || 0)
  }));
  const debtors = balances.filter(balance => balance.amount < 0);
  const creditors = balances.filter(balance => balance.amount > 0);
  const transfers = [];
  let debtorIndex = 0;
  let creditorIndex = 0;
  while (debtorIndex < debtors.length && creditorIndex < creditors.length) {
    const debtor = debtors[debtorIndex];
    const creditor = creditors[creditorIndex];
    const amount = Math.min(-debtor.amount, creditor.amount);
    transfers.push({ from: debtor.name, to: creditor.name, amount: amount / scale });
    debtor.amount += amount;
    creditor.amount -= amount;
    if (!debtor.amount) debtorIndex++;
    if (!creditor.amount) creditorIndex++;
  }
  return { total: total / scale, owed, transfers, scale };
}

function isDomesticTrip(trip) {
  return ['한국', '대한민국'].includes((trip.country || '').trim());
}

function renderExpenses(trip) {
  const domestic = isDomesticTrip(trip);
  const [year, month, day] = [new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate()];
  const today = [year, month, day].map(value => String(value).padStart(2, '0')).join('-');
  const direct = () => trip.expenses || [];
  const records = () => [
    ...direct(),
    ...trip.bookings.flatMap(booking => (booking.payments || []).map(payment => ({
      ...payment, bookingName: booking.name, sourceBooking: booking, sourcePayment: payment
    })))
  ];
  let expenseView = 'list';
  let editor = '';
  let editing = null;

  function money(amount, code) {
    return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: code }).format(amount);
  }

  function commit(changes) {
    localStorage.setItem(storageKey, JSON.stringify(trips.map(entry =>
      entry === trip ? { ...entry, ...changes } : entry
    )));
    Object.assign(trip, changes);
  }

  function updateExpense(item, replacement) {
    if (item?.sourceBooking) {
      commit({ bookings: trip.bookings.map(booking => {
        if (booking !== item.sourceBooking) return booking;
        const payments = booking.payments.flatMap(payment =>
          payment !== item.sourcePayment ? [payment] : replacement ? [replacement] : []
        );
        return { ...booking, payments };
      }) });
      return;
    }
    const expenses = item
      ? direct().flatMap(entry => entry !== item ? [entry] : replacement ? [replacement] : [])
      : [...direct(), replacement];
    commit({ expenses });
  }

  function open(mode, item = null) {
    editor = mode;
    editing = item;
    draw();
    detailContent.querySelector('.expense-form').scrollIntoView({ block: 'nearest' });
  }

  function drawEditor(codes) {
    const rates = editor === 'rates';
    const card = detailCard(rates ? '실제 환전 환율' : editing ? '지출 수정' : '지출 추가');
    const form = element('form', '', 'expense-form');
    let payment;
    const foreign = [...new Set([trip.currency, 'USD', ...codes])].filter(code => code && code !== 'KRW');
    if (rates) {
      form.append(element('p', '외화 1단위당 실제로 적용할 원화 금액을 입력해요. 예: 1엔 = 9.2원.'));
      foreign.forEach(code => {
        const rate = field('1 ' + code + '당 원화', code, trip.expenseRates?.[code], 'number');
        const input = rate.querySelector('input');
        input.step = 'any';
        input.min = '0.000001';
        input.inputMode = 'decimal';
        form.append(rate);
      });
    } else {
      payment = paymentField(trip, today, editing || {}, true);
      form.append(payment);
    }

    const error = element('p', '', 'expense-error');
    error.setAttribute('role', 'alert');
    const controls = element('div', '', 'actions');
    if (editing) {
      controls.append(button('삭제', () => {
        const question = editing.sourceBooking
          ? '경비와 예약에서 이 결제 내역을 함께 삭제할까요?'
          : '이 지출을 삭제할까요?';
        if (!window.confirm(question)) return;
        try {
          updateExpense(editing, null);
          editor = '';
          editing = null;
          draw();
        } catch (problem) {
          error.textContent = problem.message;
        }
      }, 'expense-delete'));
    }
    controls.append(button('닫기', () => { editor = ''; editing = null; draw(); }));
    const submit = element('button', '저장', 'primary');
    submit.type = 'submit';
    controls.append(submit);
    form.append(error, controls);
    form.addEventListener('submit', event => {
      event.preventDefault();
      try {
        if (rates) {
          const values = new FormData(form);
          const expenseRates = { ...trip.expenseRates };
          foreign.forEach(code => {
            const raw = values.get(code);
            if (raw === '') delete expenseRates[code];
            else if (Number.isFinite(Number(raw)) && Number(raw) > 0) expenseRates[code] = Number(raw);
            else throw new Error('환율은 0보다 큰 숫자로 입력해 주세요.');
          });
          commit({ expenseRates });
        } else {
          const item = readPayment(payment);
          if (!payment.querySelector('[name="label"]').value.trim()) {
            throw new Error('지출 이름을 입력해 주세요.');
          }
          updateExpense(editing, item);
        }
        editor = '';
        editing = null;
        draw();
      } catch (problem) {
        error.textContent = problem.message || '저장하지 못했어요.';
      }
    });
    card.append(form);
  }

  function draw() {
    detailContent.replaceChildren();
    const all = records();
    const codes = [...new Set(all.map(item => item.currency))];
    const summary = new Map(codes.map(code => [
      code, travelSettlement(all.filter(item => item.currency === code),
        10 ** currencyDecimals(code), item => item.amount)
    ]));
    const rate = code => code === 'KRW' ? 1 : Number(trip.expenseRates?.[code]);
    const missing = domestic ? [] : codes.filter(code => !Number.isFinite(rate(code)) || rate(code) <= 0);
    const converted = !domestic && all.length && !missing.length && codes.some(code => code !== 'KRW')
      ? travelSettlement(all, 1, item => item.amount * rate(item.currency)) : null;

    const toolbar = element('div', '', 'expense-nav');
    for (const [view, label] of [['list', '내역'], ['settlement', '정산']]) {
      const control = button(label, () => {
        expenseView = view;
        draw();
        detailContent.querySelector('.expense-nav [aria-pressed="true"]').focus();
      });
      control.setAttribute('aria-pressed', String(expenseView === view));
      toolbar.append(control);
    }
    toolbar.append(button('+ 지출', () => {
      expenseView = 'list';
      open('expense');
    }, 'expense-add'));
    detailContent.append(toolbar);

    if (!domestic) {
      const rateBar = element('div', '', 'expense-rate-bar');
      const savedRates = Object.entries(trip.expenseRates || {})
        .filter(([code]) => Number.isFinite(rate(code)) && rate(code) > 0)
        .map(([code]) => '1 ' + code + ' = ' +
          rate(code).toLocaleString('ko-KR', { maximumFractionDigits: 12 }) + '원');
      if (savedRates.length) rateBar.append(element('small', '적용 환율 · ' + savedRates.join(' / ')));
      rateBar.append(button('환전 환율', () => open('rates')));
      detailContent.append(rateBar);
    }

    if (editor) drawEditor(codes);
    if (expenseView === 'list') {
      drawExpenseList(all);
      return;
    }
    const totals = detailCard('총경비');
    const people = [...new Set([...tripPeople(trip), ...all.flatMap(item => [item.payer || '나', ...(item.people || [])])])];
    const shares = detailCard('인당 부담액');
    const settlement = detailCard('송금 정산');
    if (!all.length) {
      totals.append(element('p', '아직 기록한 지출이 없어요.'));
      shares.append(element('p', '지출을 추가하면 부담액이 보여요.'));
      settlement.append(element('p', '정산할 지출이 없어요.'));
      return;
    }

    function breakdown(card, label) {
      const details = element('details', '', 'expense-breakdown');
      details.append(element('summary', label));
      card.append(details);
      return details;
    }

    function amountRow(parent, name, amount) {
      const row = element('div', '', 'expense-summary-row');
      row.append(element('span', name), element('strong', amount));
      parent.append(row);
    }

    const nativeTotal = [...summary].map(([code, result]) => money(result.total, code)).join(' + ');
    totals.append(element('p', converted ? money(converted.total, 'KRW') : nativeTotal, 'expense-total'));
    if (converted) {
      breakdown(totals, '통화별 내역 보기').append(element('p', nativeTotal));
    }
    if (missing.length) totals.append(element('small', '원화 환산에 필요한 환율 · ' + missing.join(', ')));

    const nativeShares = converted ? element('div', '') : shares;
    for (const person of people) {
      const amounts = [...summary].flatMap(([code, result]) => {
        const units = result.owed.get(person) || 0;
        return units ? [money(units / result.scale, code)] : [];
      });
      amountRow(nativeShares, person, amounts.join(' + ') || '—');
      if (converted) amountRow(shares, person, money(converted.owed.get(person) || 0, 'KRW'));
    }
    if (converted) breakdown(shares, '통화별 내역 보기').append(nativeShares);

    function showTransfers(parent, lines) {
      const grouped = new Map();
      for (const { from, to, amount, code } of lines) {
        const key = JSON.stringify([from, to]);
        if (!grouped.has(key)) grouped.set(key, { from, to, amounts: [] });
        grouped.get(key).amounts.push(money(amount, code));
      }
      if (!grouped.size) parent.append(element('p', '서로 보낼 돈이 없어요.'));
      for (const { from, to, amounts } of grouped.values()) {
        amountRow(parent, from + ' → ' + to, amounts.join(' + '));
      }
    }

    const nativeTransfers = [...summary].flatMap(([code, result]) =>
      result.transfers.map(line => ({ ...line, code }))
    );
    if (converted) {
      showTransfers(settlement, converted.transfers.map(line => ({ ...line, code: 'KRW' })));
      showTransfers(breakdown(settlement, '통화별 정산 보기'), nativeTransfers);
    } else {
      showTransfers(settlement, nativeTransfers);
    }

  }

  function drawExpenseList(all) {
    if (!all.length) {
      detailContent.append(element('p', '아직 기록한 지출이 없어요.'));
      return;
    }

    const byDate = new Map();
    for (const item of [...all].sort((a, b) => (b.paidOn || '').localeCompare(a.paidOn || ''))) {
      const date = item.paidOn || '';
      if (!byDate.has(date)) byDate.set(date, []);
      byDate.get(date).push(item);
    }

    for (const [date, items] of byDate) {
      detailContent.append(element('h3', date ? dateFormat.format(new Date(date + 'T00:00:00Z')) : '결제일 미입력', 'expense-date'));
      for (const item of items) {
        const card = element('article', '', 'card expense-entry');
        const header = element('div', '', 'expense-entry-head');
        const title = item.bookingName ? item.bookingName + ' · ' + item.label : item.label;
        header.append(element('h3', title), button('수정', () => open('expense', item)));
        const info = element('dl', '', 'expense-entry-meta');
        const payer = item.payer || '나';
        info.append(element('dt', '결제자'), element('dd', payer),
          element('dt', '부담자'), element('dd', (item.people?.length ? item.people : [payer]).join(', ')));
        card.append(header, element('strong', money(item.amount, item.currency), 'expense-entry-amount'), info);
        if (item.bookingName) card.append(element('small', '예약 결제', 'expense-booking-tag'));
        detailContent.append(card);
      }
    }
  }

  draw();
}

  </script>
